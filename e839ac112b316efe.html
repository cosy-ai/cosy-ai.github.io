<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>COSY Workbench</title>
  <style>
    :root{--paper:#F3F0E9;--card:#FFFFFF;--ink:#1D2125;--muted:#656A71;--line:#E1DCD2;--accent:#C2541F;--basis:#2B6D68;--fach:#6A4C8C;--error:#A3263A}
    @media (prefers-color-scheme: dark){:root{--paper:#16191C;--card:#1F2327;--ink:#ECE8E1;--muted:#9AA0A8;--line:#2E3338;--accent:#EE8250;--basis:#5DB3AB;--fach:#AE90D2;--error:#F2919F}}
    body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:Inter,system-ui,sans-serif;background:var(--paper);color:var(--ink)}
    .box{background:var(--card);padding:2rem;border:1px solid var(--line);border-radius:14px;width:min(320px,calc(100vw - 32px));box-sizing:border-box}
    .brand{display:flex;align-items:center;gap:10px;margin-bottom:1.25rem}
    .name{font-weight:650;font-size:1.25rem;letter-spacing:-.01em}.sub{color:var(--muted);font-size:.85rem}
    p{margin:0 0 1rem;color:var(--muted)}
    input,button{box-sizing:border-box;width:100%;padding:.65rem;font:inherit;font-size:1rem;border-radius:8px}
    input{border:1px solid var(--line);background:var(--paper);color:var(--ink);margin-bottom:.5rem}
    button{border:0;background:var(--accent);color:#fff;cursor:pointer;font-weight:600}
    #error{display:none;color:var(--error);margin-top:.5rem}
    .sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
  </style>
</head>

      <div><div class="name">cosy</div><div class="sub">Workbench</div></div>

    function bytes(b64){return Uint8Array.from(atob(b64),function(c){return c.charCodeAt(0)})}
    function db(mode,op){
      return new Promise(function(resolve,reject){
        var o=indexedDB.open("cosy-pages",1);
        o.onupgradeneeded=function(){o.result.createObjectStore("k")};
        o.onerror=function(){reject(o.error)};
        o.onsuccess=function(){
          var tx=o.result.transaction("k",mode),r=op(tx.objectStore("k"));

          tx.onerror=function(){reject(tx.error)};

    async function deriveKey(pw){
